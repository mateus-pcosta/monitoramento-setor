<!doctype html>

  <script>

  <svg width="0" height="0" style="position: absolute" aria-hidden="true">

  <div class="app">
    <nav class="nav" aria-label="Principal">

      <a href="#/" data-rota=""><svg><use href="#i-painel"/></svg>Painel do ciclo</a>
      <a href="#/equipes" data-rota="equipes"><svg><use href="#i-equipes"/></svg>Quem está com o quê<span class="contador num" data-contador-espera hidden title="Demandas aguardando terceiros"></span></a>

          <div class="trilho" aria-hidden="true"><i data-nav-ciclo-barra style="width: 0%"></i></div>

    <main class="principal" id="conteudo-principal">
